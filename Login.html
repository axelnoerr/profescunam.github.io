<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfesC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- AUTH -->
  <div id="auth" class="center-box">
    <div class="logo">
      <img src="Logo.png" alt="logo">
    </div>
    <!-- LOGIN -->
    <form id="form-login">
      <h3>Iniciar sesión</h3>
      <input
        id="correo-login"
        type="email"
        placeholder="Correo"
        required
      >
      <input
        id="password-login"
        type="password"
        placeholder="Contraseña"
        autocomplete="off"
        required
      >
      <button type="submit" class="primary">
        Entrar
      </button>
      <p class="link" id="btn-ir-registro">
        ¿No tienes cuenta? Regístrate
      </p>
    </form>
    <!-- REGISTRO -->
    <form id="form-registro" class="hidden">
      <h3>Registro</h3>
      <input
        id="nombre-registro"
        type="text"
        placeholder="Usuario"
        required
      >
      <input
        id="correo-registro"
        type="email"
        placeholder="Correo"
        required
      >
      <input
        id="password-registro"
        type="password"
        placeholder="Contraseña"
        autocomplete="new-password"
        required
      >
      <input
        id="password2-registro"
        type="password"
        placeholder="Confirmar contraseña"
        autocomplete="new-password"
        required
      >
      <button type="submit" class="primary">
        Crear cuenta
      </button>
      <p class="link" id="btn-ir-login">
        Ya tengo cuenta
      </p>
    </form>
  </div>
  <!-- HEADER -->
  <header id="header" class="hidden">
    <div class="logo">
      <img src="Logo.png" alt="logo">
    </div>
    <nav>
      <a href="index.html">Opiniones</a>
      <a href="profes.html">Profesores</a>
      <a class="active">Perfil</a>
    </nav>
  </header>
  <!-- PERFIL -->
  <div id="perfil" class="perfil hidden">
    <div class="sub-header-sketch">
      <h2>Mi Perfil</h2>
    </div>
    <div class="perfil-centrado">
      <div class="avatar-box">
        <i class="bi bi-person-circle"></i>
      </div>
      <div class="datos-container">
        <div class="campo">
          <label>Nombre:</label>
          <input
            id="perfil-nombre"
            class="input-inline"
            disabled
          >
        </div>
        <div class="campo-wrapper">
          <div class="campo">
            <label>Correo:</label>
            <input
              id="perfil-correo"
              class="input-inline"
              disabled
            >
          </div>
        </div>
      </div>
      <div class="action-zone">
        <button class="btn-delete" id="btn-logout">
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
  <!-- FOOTER -->
  <footer>
    © PROFESC 2026 | Términos | Privacidad
  </footer>
  <script type="module" src="auth.js"></script>
</body>
</html>
